<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Security+ 60-Day Journey</title>
    <style>
      :root {
        --bg: #f4f6fc;
        --card: #fff;
        --tx: #1b2240;
        --mut: #6b7494;
        --ac: #5b6cff;
        --ac2: #00c2a8;
        --ln: #e1e5f2;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1125;
          --card: #181c39;
          --tx: #eef0ff;
          --mut: #9aa3c7;
          --ln: #2a2f55;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1125;
        --card: #181c39;
        --tx: #eef0ff;
        --mut: #9aa3c7;
        --ln: #2a2f55;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      #cf {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }
      .w {
        max-width: 980px;
        margin: auto;
        padding: 16px;
        display: grid;
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 6px 24px rgba(60, 70, 150, 0.08);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      h2 {
        margin: 0.1em 0;
        font-size: 1.2rem;
      }
      h3 {
        margin: 0;
        font-size: 1rem;
      }
      small {
        color: var(--mut);
      }
      .hero {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        background:
          linear-gradient(
            135deg,
            rgba(91, 108, 255, 0.14),
            rgba(0, 194, 168, 0.12)
          ),
          var(--card);
      }
      .rb {
        fill: none;
        stroke: var(--ln);
        stroke-width: 10;
      }
      .rf {
        fill: none;
        stroke: url(#g);
        stroke-width: 10;
        stroke-linecap: round;
        stroke-dasharray: 327;
        stroke-dashoffset: 327;
        transform: rotate(-90deg);
        transform-origin: 60px 60px;
        transition: stroke-dashoffset 0.9s cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      .pt {
        font: 700 24px system-ui;
        fill: var(--tx);
      }
      .sts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .sts div {
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 6px 12px;
        min-width: 92px;
      }
      .sts b {
        font-size: 1.2rem;
        display: block;
      }
      .bar {
        height: 8px;
        background: var(--ln);
        border-radius: 9px;
        overflow: hidden;
        margin: 8px 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--ac), var(--ac2));
        border-radius: 9px;
        transition: width 0.6s;
      }
      .ph {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: space-between;
      }
      .ph > div {
        flex: 1;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--ln);
        background: var(--card);
        color: var(--tx);
        border-radius: 10px;
        padding: 6px 12px;
      }
      button:hover {
        border-color: var(--ac);
      }
      .pri {
        background: linear-gradient(90deg, var(--ac), var(--ac2));
        color: #fff;
        border: 0;
      }
      .task {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--ln);
        border-radius: 12px;
        margin: 8px 0;
        cursor: pointer;
        transition: 0.25s;
      }
      .task:hover {
        transform: translateX(3px);
        border-color: var(--ac);
      }
      .task.on {
        background: rgba(0, 194, 168, 0.12);
        border-color: var(--ac2);
      }
      .task.on span:last-child {
        text-decoration: line-through;
        color: var(--mut);
      }
      .task input {
        display: none;
      }
      .bx {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 8px;
        border: 2px solid var(--mut);
        display: grid;
        place-items: center;
        transition: 0.25s;
      }
      input:checked + .bx {
        background: linear-gradient(135deg, var(--ac), var(--ac2));
        border-color: transparent;
        animation: pop 0.4s;
      }
      input:checked + .bx:after {
        content: "✓";
        color: #fff;
        font-weight: 700;
      }
      @keyframes pop {
        50% {
          transform: scale(1.35) rotate(8deg);
        }
      }
      textarea,
      input[type="number"],
      input[type="date"],
      .rw {
        width: 100%;
        font: inherit;
        color: var(--tx);
        background: var(--bg);
        border: 1px solid var(--ln);
        border-radius: 10px;
        padding: 8px;
      }
      textarea {
        min-height: 80px;
        margin-top: 8px;
      }
      .map {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .nd {
        height: 46px;
        padding: 0;
        border-radius: 14px;
        font-weight: 600;
        border-color: hsl(var(--h), 70%, 60%);
        color: hsl(var(--h), 60%, 55%);
      }
      .nd.part {
        background: hsla(var(--h), 80%, 60%, 0.25);
      }
      .nd.done {
        background: hsl(var(--h), 70%, 55%);
        color: #fff;
        border-color: transparent;
        animation: pop 0.5s;
      }
      .nd.cur {
        outline: 3px solid var(--ac);
        outline-offset: 2px;
      }
      .ml {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--ln);
        border-radius: 14px;
        margin: 10px 0;
        cursor: pointer;
      }
      .ml > div:last-child {
        flex: 1;
      }
      .bd {
        font-size: 2rem;
        width: 60px;
        height: 60px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--bg);
        filter: grayscale(1);
        opacity: 0.5;
        flex: none;
      }
      .got {
        border-color: var(--ac2);
      }
      .got .bd {
        filter: none;
        opacity: 1;
        background: linear-gradient(
          135deg,
          rgba(91, 108, 255, 0.25),
          rgba(0, 194, 168, 0.3)
        );
        animation: glow 2s infinite;
      }
      @keyframes glow {
        50% {
          box-shadow: 0 0 0 8px rgba(0, 194, 168, 0.15);
        }
      }
      .ch {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0;
      }
      .chip {
        border-radius: 20px;
        font-size: 0.8rem;
      }
      .chip.on {
        background: #ff5d7a;
        color: #fff;
        border-color: transparent;
      }
      .sc {
        margin-top: 12px;
        padding: 12px;
        border: 1px dashed var(--ln);
        border-radius: 12px;
      }
      .sc input {
        width: 90px;
        margin-left: 8px;
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .hb {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        font-size: 0.85rem;
      }
      .hb span:first-child {
        width: 150px;
      }
      .hb i {
        display: block;
        height: 12px;
        background: #ff5d7a;
        border-radius: 6px;
        min-width: 2px;
        transition: width 0.5s;
      }
      .tt {
        font:
          700 3rem ui-monospace,
          monospace;
        text-align: center;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .toast {
        position: fixed;
        left: 50%;
        top: calc(env(safe-area-inset-top, 0px) + 16px);
        transform: translateX(-50%);
        background: linear-gradient(90deg, var(--ac), var(--ac2));
        color: #fff;
        padding: 12px 20px;
        border-radius: 30px;
        z-index: 60;
        font-weight: 600;
        animation:
          tin 0.4s,
          tout 0.4s 2.7s forwards;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
      }
      @keyframes tout {
        to {
          opacity: 0;
        }
      }
      svg text {
        font-size: 10px;
        fill: var(--mut);
      }
      #dl {
        display: block;
        margin: 10px auto;
        max-width: 100%;
        touch-action: none;
        cursor: grab;
        outline: none;
      }
      #dl:active {
        cursor: grabbing;
      }
      #dl:focus-visible {
        filter: drop-shadow(0 0 6px var(--ac));
      }
      #dh {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
        cursor: grab;
      }
      #pz .chip.on {
        background: var(--ac);
      }
    </style>
  </head>
  <body>
    <canvas id="cf"></canvas>
    <div class="w">
      <header class="card hero">
        <svg viewBox="0 0 120 120" width="130">
          <defs>
            <linearGradient id="g">
              <stop offset="0" stop-color="#5b6cff" />
              <stop offset="1" stop-color="#00c2a8" />
            </linearGradient>
          </defs>
          <circle class="rb" cx="60" cy="60" r="52" />
          <circle id="rg" class="rf" cx="60" cy="60" r="52" />
          <text id="pc" class="pt" x="60" y="68" text-anchor="middle">0%</text>
        </svg>
        <div style="flex: 1; min-width: 240px">
          <h1>🛡️ Security+ SY0-701 Journey</h1>
          <small>60-day plan · Dion Training · 6 milestones</small>
          <div id="st" class="sts"></div>
          <div id="msg"></div>
        </div>
      </header>
      <section class="card" id="panel"></section>
      <section class="card">
        <h2>🗺️ Journey Map</h2>
        <small>Tap any day. Colors follow milestones.</small>
        <div id="map" class="map"></div>
      </section>
      <section class="card">
        <h2>🏅 Milestones</h2>
        <div id="ms"></div>
      </section>
      <section class="card">
        <h2>📈 Practice Exam Tracker</h2>
        <div class="g2">
          <div>
            <small id="ex"></small
            ><svg id="ch" viewBox="0 0 400 150" width="100%"></svg>
          </div>
          <div>
            <b>Weak-domain heatmap</b>
            <div id="hm"></div>
          </div>
        </div>
      </section>
      <div class="g2">
        <section class="card" style="text-align: center">
          <h2>⏱️ Focus Timer</h2>
          <small id="tl">Focus 25 min</small
          ><svg id="dl" viewBox="0 0 200 200" width="240" tabindex="0">
            <circle
              class="rb"
              cx="100"
              cy="100"
              r="80"
              style="stroke-width: 14"
            />
            <circle
              id="da"
              class="rf"
              cx="100"
              cy="100"
              r="80"
              style="
                stroke-width: 14;
                stroke-dasharray: 502.65;
                transform-origin: 100px 100px;
              "
            />
            <circle
              id="dh"
              r="11"
              cx="100"
              cy="20"
              fill="#fff"
              stroke="#5b6cff"
              stroke-width="4"
            />
            <text
              id="tt"
              x="100"
              y="110"
              text-anchor="middle"
              style="
                font:
                  700 30px ui-monospace,
                  monospace;
                fill: var(--tx);
              "
            >
              25:00
            </text></svg
          ><small
            >Drag the handle, scroll over the dial, or use ← → keys (1–120
            min)</small
          >
          <div class="row" id="pz" style="margin: 10px 0"></div>
          <div class="row">
            <button id="ts" class="pri">Start</button
            ><button id="tr">Reset</button
            ><button id="sd" title="All sounds on/off">🔔 Sound on</button>
          </div>
        </section>
        <section class="card">
          <h2>⚙️ Settings</h2>
          <div>
            <label
              >Start date <small>(finish auto-set)</small>
              <input id="sdt" type="date"
            /></label>
          </div>
          <div style="margin-top: 8px">
            <label
              >Finish date <small>(start auto-set)</small>
              <input id="fd" type="date"
            /></label>
          </div>
          <div style="margin-top: 8px">
            <label>Exam date <input id="ed" type="date" /></label>
          </div>
          <p id="sch"></p>
          <div class="row">
            <button id="th">🌓 Theme</button><button id="bk">Backup code</button
            ><button id="rs">Reset</button>
          </div>
          <textarea
            id="bt"
            placeholder="Backup code appears here. Paste a code and tap Restore."
            style="display: none"
          ></textarea
          ><button id="rt" style="display: none">Restore</button>
        </section>
      </div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/"/g, "&quot;");
      const N = [
        "",
        "Introduction",
        "Fundamentals of Security",
        "Threat Actors",
        "Physical Security",
        "Social Engineering",
        "Malware",
        "Data Protection",
        "Cryptographic Solutions",
        "Risk Management",
        "Third-party Vendor Risks",
        "Governance and Compliance",
        "Asset and Change Management",
        "Audits and Assessments",
        "Cyber Resilience and Redundancy",
        "Security Architecture",
        "Security Infrastructure",
        "Identity and Access Management (IAM) Solutions",
        "Vulnerabilities and Attacks",
        "Malicious Activity",
        "Hardening",
        "Security Techniques",
        "Vulnerability Management",
        "Alerting and Monitoring",
        "Incident Response",
        "Investigating an Incident",
        "Automation and Orchestration",
        "Security Awareness",
        "Exam Readiness Assessment",
      ];
      const W = [
        [[1]],
        [[2]],
        [[3]],
        [[4]],
        [[5]],
        [[6]],
        [[7]],
        [[8, "videos 1-7"]],
        [[8, "videos 8-13"]],
        [[9]],
        [[10]],
        [[11]],
        [[12]],
        [[13]],
        [[14]],
        [[15]],
        [[16, "videos 1-6"]],
        [[16, "videos 7-12"]],
        [[17, "videos 1-7"]],
        [
          [17, "videos 8-10"],
          [18, "videos 1-3"],
        ],
        [[18, "videos 4-10"]],
        [[19]],
        [[20]],
        [[21, "videos 1-7"]],
        [
          [21, "videos 8-10"],
          [22, "videos 1-3"],
        ],
        [[22, "videos 4-10"]],
        [[23]],
        [[24]],
        [[25]],
        [[26]],
        [[27]],
        [[28]],
      ];
      const M = [
        [
          "🧱",
          "Foundations",
          1,
          10,
          "Sections 1–9: Fundamentals to Risk Management",
        ],
        ["🧠", "Core Concepts", 11, 20, "Sections 10–17: Vendors to IAM"],
        [
          "🚀",
          "Advanced Topics",
          21,
          30,
          "Sections 18–26: Attacks to Automation",
        ],
        ["🏁", "Course Complete", 31, 33, "Sections 27–28 + rest day"],
        ["🎯", "Practice Warrior", 34, 46, "13 practice exams"],
        ["🏆", "Exam Ready", 47, 60, "14 days of retakes"],
      ];
      const DOM = [
        "General Security Concepts",
        "Threats & Vulnerabilities",
        "Security Architecture",
        "Security Operations",
        "Program Mgmt & Oversight",
      ];
      const D = [];
      W.forEach((p, i) => {
        const t = p
          .map(([s, r]) => `Section ${s}: ${N[s]}${r ? ` (${r})` : ""}`)
          .join(" + ");
        D.push({
          t,
          k: "w",
          tasks: [
            ...(i ? [] : ["Download the course PDFs"]),
            "Watch " + t,
            "Take notes & highlight terms in the study guide",
            "Create flashcards for new terms",
            "Review yesterday's flashcards",
          ],
        });
      });
      D.push({
        t: "Relax Day",
        k: "r",
        tasks: [
          "Rest and recharge. You earned it",
          "Optional: watch Conclusion + exam tips",
        ],
      });
      for (let i = 0; i < 13; i++)
        D.push({
          t: `Practice Exam #${i + 1}`,
          k: "e",
          tasks: [
            "Do a brain dump before starting",
            `Take Practice Exam #${i + 1}`,
            "Review incorrect answers & read explanations",
            "Add misses to flashcards & study guide",
            "Log score & weak domains below",
          ],
        });
      for (let i = 0; i < 14; i++)
        D.push({
          t: `Retake Practice Exam #${(i % 13) + 1}`,
          k: "e",
          tasks: [
            "Retake the exam; think through WHY each answer is right",
            "Review incorrect answers & explanations",
            "Update your brain dump",
            "Log score & weak domains below",
          ],
        });

      // State Management
      let ST = {
        done: {},
        notes: {},
        sc: {},
        when: {},
        exam: "",
        start: "",
        rw: {},
        theme: "",
      };
      try {
        Object.assign(ST, JSON.parse(localStorage.getItem("sp60") || "{}"));
      } catch (e) {}

      // WIRED: Save to localStorage AND push to Firebase
      const save = () => {
        try {
          localStorage.setItem("sp60", JSON.stringify(ST));
        } catch (e) {}
        if (window.syncToFirebase) window.syncToFirebase(ST);
      };

      // WIRED: Listen for incoming data from Firebase and update UI
      window.loadFromFirebase = (data) => {
        ST = data;
        try {
          localStorage.setItem("sp60", JSON.stringify(ST));
        } catch (e) {}
        if (ST.theme) document.documentElement.dataset.theme = ST.theme;
        all();
      };

      const fmt = (d) =>
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0");
      const chk = (i, j) => !!(ST.done[i] && ST.done[i][j]),
        dn = (i) => D[i].tasks.every((_, j) => chk(i, j)),
        mi = (i) => M.findIndex((m) => i + 1 <= m[3]);
      const mdays = (k) =>
          D.map((_, i) => i).filter(
            (i) => i + 1 >= M[k][2] && i + 1 <= M[k][3],
          ),
        mfull = (k) => mdays(k).every(dn);
      const SD = () => {
        if (!ST.fin) return ST.start || "";
        const d = new Date(ST.fin + "T00:00");
        d.setDate(d.getDate() - 59);
        return fmt(d);
      };
      let cur = D.findIndex((_, i) => !dn(i));
      if (cur < 0) cur = 59;
      if (ST.theme) document.documentElement.dataset.theme = ST.theme;
      function streak() {
        const s = new Set(Object.values(ST.when));
        let d = new Date(),
          n = 0;
        if (!s.has(fmt(d))) d.setDate(d.getDate() - 1);
        while (s.has(fmt(d))) {
          n++;
          d.setDate(d.getDate() - 1);
        }
        return n;
      }
      const cv = $("#cf"),
        cx = cv.getContext("2d");
      let P = [],
        raf = 0;
      const size = () => {
        cv.width = innerWidth;
        cv.height = innerHeight;
      };
      size();
      addEventListener("resize", size);
      function boom(n, x, y) {
        x = x ?? innerWidth / 2;
        y = y ?? innerHeight / 3;
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.28,
            v = 3 + Math.random() * (n > 40 ? 9 : 5);
          P.push({
            x,
            y,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v - 4,
            r: 3 + Math.random() * 4,
            c: `hsl(${Math.random() * 360},90%,60%)`,
            l: 70 + Math.random() * 40,
            o: Math.random() * 6,
          });
        }
        if (!raf) raf = requestAnimationFrame(tick);
      }
      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        P = P.filter((p) => p.l-- > 0);
        P.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.vx *= 0.99;
          cx.save();
          cx.translate(p.x, p.y);
          cx.rotate((p.o += 0.1));
          cx.fillStyle = p.c;
          cx.globalAlpha = Math.min(1, p.l / 30);
          cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          cx.restore();
        });
        raf = P.length ? requestAnimationFrame(tick) : 0;
        if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
      }
      const toast = (h) => {
        const t = document.createElement("div");
        t.className = "toast";
        t.innerHTML = h;
        document.body.append(t);
        setTimeout(() => t.remove(), 3200);
      };
      function hero() {
        let tot = 0,
          ck = 0,
          dd = 0;
        D.forEach((d, i) => {
          tot += d.tasks.length;
          d.tasks.forEach((_, j) => chk(i, j) && ck++);
          dn(i) && dd++;
        });
        const p = Math.round((ck / tot) * 100);
        $("#rg").style.strokeDashoffset = 327 * (1 - ck / tot);
        $("#pc").textContent = p + "%";
        const t0 = new Date().setHours(0, 0, 0, 0);
        const cd = ST.exam
            ? Math.ceil((new Date(ST.exam + "T00:00") - t0) / 864e5)
            : null,
          fdl = ST.fin
            ? Math.ceil((new Date(ST.fin + "T00:00") - t0) / 864e5)
            : null;
        let sch = "";
        if (SD()) {
          const ex = Math.floor((t0 - new Date(SD() + "T00:00")) / 864e5) + 1,
            df = dd - Math.max(0, ex);
          sch =
            ex <= 0 && !dd
              ? "⏳ Starts in " + (1 - ex) + " day(s)"
              : df >= 0
                ? `✅ ${df ? df + " day(s) ahead of" : "On"} schedule`
                : `⚠️ ${-df} day(s) behind. Adjust, don't panic.`;
        }
        if (ST.fin) {
          const ld = (s) =>
            new Date(s + "T00:00").toLocaleDateString(undefined, {
              day: "numeric",
              month: "short",
            });
          sch +=
            (sch ? " · " : "") + "📅 Plan: " + ld(SD()) + " → " + ld(ST.fin);
        }
        $("#sch").textContent = sch;
        $("#st").innerHTML =
          `<div><b>${dd}/60</b><small>days done</small></div><div><b>${streak()} 🔥</b><small>day streak</small></div><div><b>${cd === null ? "—" : cd}</b><small>days to exam</small></div><div><b>${fdl === null ? "—" : fdl}</b><small>days to finish</small></div>` +
          (sch ? `<div style="flex:1"><small>${sch}</small></div>` : "");
        $("#msg").textContent =
          p < 1
            ? "Your journey starts with one check ✔️"
            : p < 25
              ? "Great start. Momentum builds!"
              : p < 50
                ? "Quarter done. Keep stacking days."
                : p < 75
                  ? "Past halfway. Exams are ahead!"
                  : p < 100
                    ? "Final stretch. You've got this!"
                    : "🏆 Journey complete. Go pass that exam!";
      }
      function panel() {
        const d = D[cur],
          m = M[mi(cur)],
          c = d.tasks.filter((_, j) => chk(cur, j)).length,
          sc = ST.sc[cur] || { s: "", w: [] };
        $("#panel").innerHTML =
          `<div class="ph"><button id="pv">‹</button><div><small>Day ${cur + 1} of 60${SD() ? " · " + ((d) => (d.setDate(d.getDate() + cur), d))(new Date(SD() + "T00:00")).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : ""} · ${m[0]} ${m[1]}</small><h2>${d.t}</h2></div><button id="nx">›</button></div><div class="bar"><i style="width:${(c / d.tasks.length) * 100}%"></i></div>` +
          d.tasks
            .map(
              (t, j) =>
                `<label class="task ${chk(cur, j) ? "on" : ""}"><input type="checkbox" data-j="${j}" ${chk(cur, j) ? "checked" : ""}><span class="bx"></span><span>${t}</span></label>`,
            )
            .join("") +
          (d.k == "e"
            ? `<div class="sc"><label>Score (% or out of 900) <input id="scv" type="number" min="0" max="900" value="${sc.s}"></label><div class="ch">${DOM.map((n, k) => `<button class="chip ${sc.w.includes(k) ? "on" : ""}" data-d="${k}">D${k + 1}${n}</button>`).join("")}</div><small>Tap the domains where you missed questions.</small></div>`
            : "") +
          `<textarea id="nt" placeholder="Notes / brain dump for this day...">${esc(ST.notes[cur] || "")}</textarea>`;
      }
      function map() {
        $("#map").innerHTML = D.map((d, i) => {
          const c = d.tasks.filter((_, j) => chk(i, j)).length,
            s = c == d.tasks.length ? "done" : c ? "part" : "";
          return `<button class="nd ${s} ${i == cur ? "cur" : ""}" style="--h:${mi(i) * 55}" data-i="${i}" title="${esc(d.t)}">${s == "done" ? "✓" : i + 1}</button>`;
        }).join("");
      }
      function mils() {
        $("#ms").innerHTML = M.map((m, k) => {
          const n = mdays(k).filter(dn).length,
            t = mdays(k).length,
            f = n == t;
          return `<div class="ml ${f ? "got" : ""}" data-k="${k}"><div class="bd">${m[0]}</div><div><h3>${k + 1}. ${m[1]}</h3><small>Days ${m[2]}–${m[3]} · ${m[4]} · ${n}/${t}${f ? " · Badge unlocked! 🎉" : ""}</small><div class="bar"><i style="width:${(n / t) * 100}%"></i></div><input class="rw" data-k="${k}" placeholder="🎁 My reward for this milestone" value="${esc(ST.rw[k] || "")}"></div></div>`;
        }).join("");
      }
      function exams() {
        const pts = Object.entries(ST.sc)
          .filter(([i, v]) => v.s !== "" && v.s != null)
          .map(([i, v]) => [+i, Math.min(100, +v.s > 100 ? +v.s / 9 : +v.s)])
          .sort((a, b) => a[0] - b[0]);
        const x = (i) => 25 + (i - 33) * (350 / 26),
          y = (v) => 130 - v * 1.1;
        $("#ch").innerHTML =
          `<line x1="20" x2="390" y1="${y(83)}" y2="${y(83)}" stroke="#00c2a8" stroke-dasharray="4"/><text x="22" y="${y(83) - 3}">pass ≈83% (750/900)</text>` +
          (pts.length
            ? `<polyline fill="none" stroke="#5b6cff" stroke-width="2.5" points="${pts.map((p) => x(p[0]) + "," + y(p[1])).join(" ")}"/>` +
              pts
                .map(
                  (p) =>
                    `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="${p[1] >= 83 ? "#00c2a8" : "#ff5d7a"}"/>`,
                )
                .join("")
            : '<text x="120" y="80">Log scores on exam days</text>');
        $("#ex").textContent = pts.length
          ? `${pts.length} logged · best ${Math.round(Math.max(...pts.map((p) => p[1])))}% · latest ${Math.round(pts[pts.length - 1][1])}%`
          : "No scores yet";
        const cn = DOM.map(
            (_, k) =>
              Object.values(ST.sc).filter((v) => (v.w || []).includes(k))
                .length,
          ),
          mx = Math.max(1, ...cn);
        $("#hm").innerHTML = DOM.map(
          (n, k) =>
            `<div class="hb"><span>D${k + 1} ${n}</span><i style="width:${(cn[k] / mx) * 50}%"></i><b>${cn[k]}</b></div>`,
        ).join("");
      }
      const all = () => {
        $("#sdt").value = SD();
        $("#fd").value = ST.fin || "";
        hero();
        panel();
        map();
        mils();
        exams();
      };
      $("#panel").onchange = (e) => {
        const t = e.target;
        if (t.type != "checkbox") return;
        const j = +t.dataset.j,
          was = dn(cur);
        (ST.done[cur] = ST.done[cur] || [])[j] = t.checked;
        if (!SD()) {
          ST.start = fmt(new Date());
          ST.fin = ad(ST.start, 59);
        }
        if (t.checked) {
          const r = t.getBoundingClientRect();
          boom(14, r.left + 12, r.top + 12);
        }
        if (!(dn(cur) && !was)) sfx(t.checked ? "check" : "uncheck");
        if (dn(cur) && !was) {
          ST.when[cur] = fmt(new Date());
          const k = mi(cur);
          if (D.every((_, i) => dn(i))) {
            boom(250);
            sfx("ms");
            toast("🏆 JOURNEY COMPLETE! Go get that cert!");
          } else if (mfull(k)) {
            boom(180);
            sfx("ms");
            toast(`${M[k][0]} Milestone unlocked: ${M[k][1]}!`);
          } else {
            boom(80);
            sfx("day");
            toast(`🎉 Day ${cur + 1} complete!`);
          }
        } else if (!dn(cur)) delete ST.when[cur];
        save();
        all();
      };
      $("#panel").oninput = (e) => {
        if (e.target.id == "nt") ST.notes[cur] = e.target.value;
        if (e.target.id == "scv") {
          ST.sc[cur] = { s: e.target.value, w: (ST.sc[cur] || {}).w || [] };
          exams();
        }
        save();
      };
      $("#panel").onclick = (e) => {
        const c = e.target.closest(".chip"),
          b = e.target.closest("button");
        if (c) {
          const o = ST.sc[cur] || { s: "", w: [] },
            k = +c.dataset.d;
          o.w = o.w.includes(k) ? o.w.filter((z) => z != k) : [...o.w, k];
          ST.sc[cur] = o;
          save();
          panel();
          exams();
        } else if (b && b.id == "pv") {
          cur = Math.max(0, cur - 1);
          panel();
          map();
        } else if (b && b.id == "nx") {
          cur = Math.min(59, cur + 1);
          panel();
          map();
        }
      };
      $("#map").onclick = (e) => {
        const b = e.target.closest(".nd");
        if (b) {
          cur = +b.dataset.i;
          panel();
          map();
          $("#panel").scrollIntoView({ behavior: "smooth" });
        }
      };
      $("#ms").onclick = (e) => {
        if (e.target.tagName == "INPUT") return;
        const m = e.target.closest(".ml");
        if (m) {
          const ds = mdays(+m.dataset.k);
          cur = ds.find((i) => !dn(i)) ?? ds[0];
          panel();
          map();
          $("#panel").scrollIntoView({ behavior: "smooth" });
        }
      };
      $("#ms").oninput = (e) => {
        if (e.target.classList.contains("rw")) {
          ST.rw[e.target.dataset.k] = e.target.value;
          save();
        }
      };
      $("#ed").value = ST.exam;
      const ad = (s, n) => {
        if (!s) return "";
        const d = new Date(s + "T00:00");
        d.setDate(d.getDate() + n);
        return fmt(d);
      };
      $("#sdt").onchange = (e) => {
        ST.start = e.target.value;
        ST.fin = ad(ST.start, 59);
        save();
        all();
      };
      $("#fd").onchange = (e) => {
        ST.fin = e.target.value;
        ST.start = ad(ST.fin, -59);
        save();
        all();
      };
      $("#ed").onchange = (e) => {
        ST.exam = e.target.value;
        save();
        hero();
      };
      $("#th").onclick = () => {
        const d = document.documentElement,
          dk = getComputedStyle(d).getPropertyValue("--bg").trim() == "#0e1125";
        ST.theme = d.dataset.theme = dk ? "light" : "dark";
        save();
      };
      $("#bk").onclick = () => {
        $("#bt").style.display = $("#rt").style.display = "block";
        $("#bt").value = JSON.stringify(ST);
      };
      $("#rt").onclick = () => {
        try {
          Object.assign(ST, JSON.parse($("#bt").value));
          save();
          cur = Math.max(
            0,
            D.findIndex((_, i) => !dn(i)),
          );
          all();
          toast("✅ Progress restored");
        } catch (e) {
          toast("Invalid backup code");
        }
      };
      $("#rs").onclick = () => {
        if ($("#rs").dataset.s) {
          ST = {
            done: {},
            notes: {},
            sc: {},
            when: {},
            exam: "",
            start: "",
            rw: {},
            theme: ST.theme,
          };
          save();
          cur = 0;
          all();
          $("#rs").textContent = "Reset";
          delete $("#rs").dataset.s;
        } else {
          $("#rs").textContent = "Tap again to confirm";
          $("#rs").dataset.s = 1;
        }
      };
      let fm = 25,
        tm = 1500,
        tot = 1500,
        ti = 0,
        md = "focus",
        dg = 0,
        en = 0;
      const C = 502.65,
        mm = (s) =>
          String(Math.floor(s / 60)).padStart(2, "0") +
          ":" +
          String(s % 60).padStart(2, "0"),
        lab = (m) =>
          m < 60 ? m + "m" : m == 60 ? "1h" : m == 120 ? "2h" : "1h" + (m - 60);
      function tmr() {
        $("#tt").textContent = mm(tm);
        const f = Math.min(1, tm / 7200),
          a = f * 6.2832;
        $("#da").style.strokeDashoffset = C * (1 - f);
        $("#dh").setAttribute("cx", 100 + 80 * Math.sin(a));
        $("#dh").setAttribute("cy", 100 - 80 * Math.cos(a));
        $("#dh").style.display = ti ? "none" : "";
      }
      function setMin(m) {
        m = Math.max(1, Math.min(120, m));
        if (m != fm) tick(m);
        fm = m;
        tm = tot = fm * 60;
        md = "focus";
        $("#tl").textContent =
          "Focus " + fm + " min" + (fm > 60 ? " (deep work)" : "");
        document
          .querySelectorAll("#pz .chip")
          .forEach((c) => c.classList.toggle("on", +c.dataset.m == fm));
        tmr();
      }
      $("#pz").innerHTML = [15, 25, 45, 60, 90, 120]
        .map((m) => `<button class="chip" data-m="${m}">${lab(m)}</button>`)
        .join("");
      $("#pz").onclick = (e) => {
        const c = e.target.closest(".chip");
        if (c && !ti) {
          setMin(+c.dataset.m);
          $("#ts").textContent = "Start";
        }
      };
      const dl = $("#dl"),
        pick = (e) => {
          if (ti || md != "focus") return;
          const r = dl.getBoundingClientRect(),
            a = Math.atan2(
              e.clientX - r.left - r.width / 2,
              -(e.clientY - r.top - r.height / 2),
            );
          let m = Math.round(((a < 0 ? a + 6.2832 : a) / 6.2832) * 120);
          if (m == 0) m = fm > 60 ? 120 : 1;
          if (fm >= 100 && m <= 20) m = 120;
          if (fm <= 20 && m >= 100) m = 1;
          setMin(m);
        };
      dl.onpointerdown = (e) => {
        dg = 1;
        dl.setPointerCapture(e.pointerId);
        pick(e);
      };
      dl.onpointermove = (e) => {
        if (dg) pick(e);
      };
      dl.onpointerup = dl.onpointercancel = () => (dg = 0);
      dl.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (!ti && md == "focus")
            setMin(fm + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 5 : 1));
        },
        { passive: false },
      );
      dl.onkeydown = (e) => {
        if (ti || md != "focus") return;
        const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[
          e.key
        ];
        if (k) {
          e.preventDefault();
          setMin(fm + k * (e.shiftKey ? 5 : 1));
        }
      };
      $("#ts").onclick = () => {
        if (ti) {
          clearInterval(ti);
          ti = 0;
          $("#ts").textContent = "Resume";
          tmr();
        } else {
          $("#ts").textContent = "Pause";
          ac();
          en = Date.now() + tm * 1000;
          ti = setInterval(() => {
            tm = Math.max(0, Math.ceil((en - Date.now()) / 1000));
            if (tm <= 0) {
              clearInterval(ti);
              ti = 0;
              boom(60);
              beep();
              toast(
                md == "focus"
                  ? "⏰ " + fm + " min focus done! 5-minute break"
                  : "💪 Break over. Back to it!",
              );
              md = md == "focus" ? "break" : "focus";
              tm = tot = md == "focus" ? fm * 60 : 300;
              $("#tl").textContent =
                md == "focus" ? "Focus " + fm + " min" : "Break 5 min";
              $("#ts").textContent = "Start";
            }
            tmr();
          }, 250);
          tmr();
        }
      };
      let AC = null,
        SO = 1;
      const ac = () => {
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state == "suspended") AC.resume();
        } catch (e) {}
      };
      function beep() {
        if (!SO) return;
        try {
          ac();
          [0, 0.4, 0.8].forEach((d) => {
            const o = AC.createOscillator(),
              g = AC.createGain(),
              t = AC.currentTime + d;
            o.type = "sine";
            o.frequency.value = 880;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.4, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
            o.connect(g);
            g.connect(AC.destination);
            o.start(t);
            o.stop(t + 0.35);
          });
        } catch (e) {}
      }
      function tone(f, t0, d, ty, v) {
        const o = AC.createOscillator(),
          g = AC.createGain(),
          t = AC.currentTime + t0;
        o.type = ty || "sine";
        o.frequency.setValueAtTime(f[0], t);
        if (f[1]) o.frequency.exponentialRampToValueAtTime(f[1], t + d);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v || 0.25, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g);
        g.connect(AC.destination);
        o.start(t);
        o.stop(t + d + 0.02);
      }
      function sfx(k) {
        if (!SO) return;
        try {
          ac();
          if (k == "check") tone([660, 990], 0, 0.14, "triangle", 0.3);
          else if (k == "uncheck") tone([440, 220], 0, 0.16, "square", 0.12);
          else if (k == "day")
            [523, 659, 784, 1047].forEach((f, i) =>
              tone([f], i * 0.12, 0.3, "sine", 0.3),
            );
          else if (k == "ms") {
            [523, 659, 784, 1047, 1319, 1568].forEach((f, i) =>
              tone([f], i * 0.1, 0.45, "triangle", 0.3),
            );
            tone([261], 0, 1, "sine", 0.25);
            tone([784], 0.6, 0.9, "sine", 0.25);
          }
        } catch (e) {}
      }
      let lt = 0,
        NB = null;
      function tick(m) {
        if (!SO) return;
        const n = performance.now();
        if (n - lt < 30) return;
        lt = n;
        try {
          ac();
          if (!NB) {
            NB = AC.createBuffer(
              1,
              Math.floor(AC.sampleRate * 0.05),
              AC.sampleRate,
            );
            const d = NB.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          }
          const b = m % 5 == 0,
            t = AC.currentTime,
            s = AC.createBufferSource(),
            f = AC.createBiquadFilter(),
            g = AC.createGain();
          s.buffer = NB;
          f.type = "bandpass";
          f.frequency.value = (b ? 1500 : 2300) * (0.9 + Math.random() * 0.2);
          f.Q.value = 1.1;
          g.gain.setValueAtTime(b ? 1.2 : 0.8, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + (b ? 0.035 : 0.02));
          s.connect(f);
          f.connect(g);
          g.connect(AC.destination);
          s.start(t);
          s.stop(t + 0.05);
          tone([b ? 190 : 140, 60], 0, 0.045, "sine", b ? 0.4 : 0.25);
        } catch (e) {}
      }
      $("#sd").onclick = () => {
        SO = !SO;
        $("#sd").textContent = SO ? "🔔 Sound on" : "🔕 Sound off";
        beep();
      };
      $("#tr").onclick = () => {
        clearInterval(ti);
        ti = 0;
        setMin(fm);
        $("#ts").textContent = "Start";
      };
      setMin(25);
      all();
    </script>

    <!-- Firebase App (Core) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        set,
        onValue,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

      const firebaseConfig = {
        databaseURL:
          "https://comptia-secplus-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const trackerRef = ref(db, "tracker/progress");

      // Send data to Firebase whenever the app saves
      window.syncToFirebase = function (dataObject) {
        set(trackerRef, dataObject).catch((error) => {
          console.error("Error saving data: ", error);
        });
      };

      // Listen for changes from Firebase (e.g. from your phone)
      onValue(trackerRef, (snapshot) => {
        const data = snapshot.val();
        if (data && window.loadFromFirebase) {
          window.loadFromFirebase(data);
        }
      });
    </script>
  </body>
